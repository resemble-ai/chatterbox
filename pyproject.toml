[project]
name = "chatterbox-tts"
version = "0.1.7.post1"
description = "An independently maintained fork of Resemble AI's Chatterbox TTS and voice conversion library"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
dependencies = [
    # numpy 1.x for Python < 3.13 (no 1.x wheels on 3.13+), numpy 2.x for 3.13+
    "numpy>=1.24.0,<2.0.0; python_version < '3.13'",
    "numpy>=2.0.0,<3; python_version >= '3.13'",
    "librosa==0.11.0",
    "s3tokenizer==0.3.0",
    # torch 2.6.0 supports Python 3.10-3.13; Python 3.14 needs 2.9.0+
    "torch==2.6.0; python_version < '3.14'",
    "torch==2.9.1; python_version >= '3.14'",
    "torchaudio==2.6.0; python_version < '3.14'",
    "torchaudio==2.9.1; python_version >= '3.14'",
    "transformers==5.2.0",
    "diffusers==0.29.0",
    # This wheel includes the watermark checkpoints; no moving Git dependency.
    "resemble-perth==1.0.1",
    # Perth 1.0.1 uses pkg_resources, which setuptools 81 removes.
    "setuptools>=80.9,<81",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg==1.0.2",
    "pykakasi==2.3.0",
    "pyloudnorm>=0.1.1,<0.2",
    "omegaconf>=2.3,<3",
    "huggingface-hub>=1.3,<2",
    "soundfile>=0.13,<0.14",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
demo = ["gradio==6.8.0"]

[project.scripts]
chatterbox-models = "chatterbox.archive:main"

[project.urls]
Homepage = "https://github.com/pbsladek/chatterbox"
Repository = "https://github.com/pbsladek/chatterbox"
Issues = "https://github.com/pbsladek/chatterbox/issues"
Upstream = "https://github.com/resemble-ai/chatterbox"

[dependency-groups]
build = [
    "build>=1.2,<2",
    "twine>=6,<7",
    "packaging>=25,<27",
    "tomli>=2,<3; python_version < '3.11'",
]
dev = [
    {include-group = "build"},
    "pytest>=8,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
