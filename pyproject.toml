[project]
name = "chatterbox-light"
version = "1.0.1"
description = "Lightweight fork of Resemble AI's Chatterbox text-to-speech and voice conversion, with fewer dependencies and no watermarking"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Resemble AI"},
]
maintainers = [
    {name = "Blair Chintella"},
]
dependencies = [
    "numpy",
    "torch",
    "torchaudio",
    "transformers>=4.46.0",
    "diffusers",
    "safetensors",
    "s3tokenizer",
    "einops",
    "scipy",
    "pyloudnorm",
    "soundfile",
    "tokenizers",
    "tqdm",
    "huggingface-hub",
]

[project.optional-dependencies]
multilingual = [
    "pykakasi",
    "spacy-pkuseg",
]

[project.urls]
Homepage = "https://github.com/BBC-Esq/chatterbox-light"
Repository = "https://github.com/BBC-Esq/chatterbox-light"
Upstream = "https://github.com/resemble-ai/chatterbox"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
